<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Production Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F6F4EE;
    --ink:#231F1C;
    --ink-soft:#6B655D;
    --line:#D9D3C6;
    --image-clr:#3E6259;
    --image-clr-soft:#DCE6E1;
    --video-clr:#8C4A2F;
    --video-clr-soft:#F0DDD2;
    --extra-clr:#A6862C;
    --extra-clr-soft:#F1E6C8;
    --card-bg:#FFFEFB;
  }
  body[data-theme="dark"]{
    --paper:#181613;
    --ink:#F5F1E8;
    --ink-soft:#B8B0A2;
    --line:#3A352E;
    --image-clr:#7FC4AD;
    --image-clr-soft:#233A32;
    --video-clr:#E8935F;
    --video-clr-soft:#3D2A1E;
    --extra-clr:#E3C465;
    --extra-clr-soft:#3B331A;
    --card-bg:#211E1A;
    color-scheme:dark;
  }
  body{transition:background 0.2s ease, color 0.2s ease;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    padding:18px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{margin-bottom:20px;}
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .theme-toggle{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:2px;
  }
  header .kicker{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  h1{
    font-family:'Newsreader',serif;
    font-weight:600;
    font-size:28px;
    margin:2px 0 4px;
    line-height:1.15;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--image-clr);}

  .clients-row{
    display:flex;
    gap:10px;
    margin:18px 0;
  }
  .client-name-field{
    flex:1;
    min-width:0;
  }
  .client-name-field label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .client-name-field input{
    width:100%;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    font-family:'Newsreader',serif;
    font-size:17px;
    font-weight:600;
    padding:4px 2px;
    color:var(--ink);
  }
  .client-name-field input:focus{outline:none;border-bottom-color:var(--image-clr);}

  .cards{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .card-top .cname{
    font-family:'Newsreader',serif;
    font-size:18px;
    font-weight:600;
  }
  .card-top .started{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .meter-row{margin-bottom:9px;}
  .meter-row:last-child{margin-bottom:0;}
  .meter-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    margin-bottom:4px;
  }
  .meter-label .tag{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  .meter-track{
    height:7px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
    position:relative;
  }
  .meter-fill{
    height:100%;
    border-radius:4px;
  }
  .extra-pill{
    font-size:11px;
    color:var(--extra-clr);
    background:var(--extra-clr-soft);
    padding:1px 7px;
    border-radius:9px;
    margin-left:6px;
  }

  .add-panel{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px;
    margin-bottom:22px;
  }
  .add-panel h2{
    font-family:'Newsreader',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 12px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field select, .field input[type=text], .field input[type=date]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card-bg);
    font-family:'Karla',sans-serif;
    font-size:14.5px;
    color:var(--ink);
  }
  .field select:focus, .field input:focus{outline:none;border-color:var(--image-clr);}

  .type-toggle{
    display:flex;
    gap:8px;
  }
  .type-toggle button{
    flex:1;
    padding:10px;
    border:1px solid var(--line);
    background:var(--card-bg);
    border-radius:3px;
    font-family:'Karla',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .type-toggle button.active.image{
    background:var(--image-clr-soft);
    border-color:var(--image-clr);
    color:var(--image-clr);
  }
  .type-toggle button.active.video{
    background:var(--video-clr-soft);
    border-color:var(--video-clr);
    color:var(--video-clr);
  }
  .type-toggle button.active.misc{
    background:var(--extra-clr-soft);
    border-color:var(--extra-clr);
    color:var(--extra-clr);
  }
  .type-toggle button.hidden{display:none;}

  .extra-toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  .extra-toggle-row .etx-label{
    font-size:13.5px;
    font-weight:600;
  }
  .extra-toggle-row .etx-sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .switch{
    position:relative;
    width:42px;
    height:24px;
    flex-shrink:0;
  }
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{
    position:absolute;
    cursor:pointer;
    top:0;left:0;right:0;bottom:0;
    background:var(--line);
    border-radius:24px;
    transition:0.15s;
  }
  .switch .slider:before{
    position:absolute;
    content:"";
    height:18px;width:18px;
    left:3px;bottom:3px;
    background:var(--card-bg);
    border-radius:50%;
    transition:0.15s;
  }
  .switch input:checked + .slider{background:var(--extra-clr);}
  .switch input:checked + .slider:before{transform:translateX(18px);}

  .field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card-bg);
    font-family:'Karla',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    resize:vertical;
    min-height:56px;
  }
  .field textarea:focus{outline:none;border-color:var(--extra-clr);}

  .submit-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:3px;
    background:var(--ink);
    color:var(--paper);
    font-family:'Karla',sans-serif;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:2px;
  }
  .submit-btn:active{opacity:0.85;}

  .log-section h2{
    font-family:'Newsreader',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .log-section h2 .count{
    font-size:12px;
    font-weight:400;
    color:var(--ink-soft);
    font-family:'Karla',sans-serif;
  }
  .log-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .log-item:last-child{border-bottom:none;}
  .log-dot{
    width:9px;height:9px;
    border-radius:50%;
    margin-top:5px;
    flex-shrink:0;
  }
  .log-main{flex:1;min-width:0;}
  .log-name{font-size:14.5px;font-weight:600;}
  .log-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .log-status{
    font-size:11px;
    padding:2px 8px;
    border-radius:9px;
    white-space:nowrap;
    align-self:center;
  }
  .log-status.committed{background:var(--line);color:var(--ink-soft);}
  .log-status.extra{background:var(--extra-clr-soft);color:var(--extra-clr);}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:16px;cursor:pointer;padding:0 2px;line-height:1;
  }
  .empty{
    color:var(--ink-soft);
    font-size:13.5px;
    padding:16px 0;
    text-align:center;
  }

  .backup-row{
    display:flex;
    gap:8px;
    margin:22px 0 0;
  }
  .backup-btn{
    margin:0;
    flex:1;
  }
  #backupStatus{
    margin-top:7px;
    min-height:16px;
  }

  .report-btn{
    width:100%;
    padding:11px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    border-radius:3px;
    font-family:'Karla',sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin:22px 0 10px;
  }
  .report-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px;
    font-size:13.5px;
    line-height:1.7;
    white-space:pre-wrap;
    display:none;
    margin-bottom:20px;
    color:var(--ink);
  }
  .report-box.show{display:block;}
  .copy-btn{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    color:var(--image-clr);
    background:none;
    border:none;
    cursor:pointer;
    font-weight:600;
    padding:0;
  }
  .status-line{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
    min-height:16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-top">
      <div>
        <div class="kicker">8-week creative plan · 13 images + 4 videos / reels per client</div>
        <h1>Creative <em>Production</em> Log</h1>
      </div>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">◐</button>
    </div>
  </header>

  <div class="clients-row">
    <div class="client-name-field">
      <label>Client A</label>
      <input type="text" id="clientAName" value="Client 1" maxlength="30">
    </div>
    <div class="client-name-field">
      <label>Client B</label>
      <input type="text" id="clientBName" value="Client 2" maxlength="30">
    </div>
  </div>

  <div class="cards" id="cardsContainer"></div>

  <div class="add-panel">
    <h2>Log a creative</h2>
    <div class="field">
      <label>Client</label>
      <select id="entryClient">
        <option value="A"></option>
        <option value="B"></option>
      </select>
    </div>

    <div class="extra-toggle-row">
      <div>
        <div class="etx-label">Mark as Extra</div>
        <div class="etx-sub">Bonus work outside the 13 images + 4 videos</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="extraCheckbox">
        <span class="slider"></span>
      </label>
    </div>

    <div class="field">
      <label>Type</label>
      <div class="type-toggle">
        <button type="button" class="active image" id="btnImage" data-type="image">Image</button>
        <button type="button" class="video" id="btnVideo" data-type="video">Video / Reel</button>
        <button type="button" class="misc hidden" id="btnMisc" data-type="misc">Misc / Other</button>
      </div>
    </div>
    <div class="field">
      <label>Creative name</label>
      <input type="text" id="entryName" placeholder="e.g. Diwali offer post 3">
    </div>
    <div class="field" id="descriptionField" style="display:none;">
      <label>What did you give? (optional)</label>
      <textarea id="entryDescription" placeholder="e.g. Built and delivered the WhatsApp appointment booking form"></textarea>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="entryDate">
    </div>
    <button class="submit-btn" id="addBtn">Add to log</button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="log-section">
    <h2>Full log <span class="count" id="logCount"></span></h2>
    <div id="logList"></div>
  </div>

  <div class="backup-row">
    <button class="report-btn backup-btn" id="exportBtn">Export backup</button>
    <button class="report-btn backup-btn" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <div class="status-line" id="backupStatus"></div>
  <button class="report-btn" id="reportBtn">Generate end-of-plan report</button>
  <div class="report-box" id="reportBox"></div>

</div>

<script>
const IMG_TARGET = 13;
const VID_TARGET = 4;
const STORAGE_KEY = 'tracker-state-v1';

let state = {
  clientAName: 'Client 1',
  clientBName: 'Client 2',
  entries: [], // {id, client:'A'|'B', type:'image'|'video'|'misc', name, date, isExtra, description}
  theme: 'light'
};

let currentType = 'image';
let isExtra = false;

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    // no saved data yet, use defaults
  }
  document.getElementById('clientAName').value = state.clientAName;
  document.getElementById('clientBName').value = state.clientBName;
  document.getElementById('entryDate').value = todayISO();
  applyTheme();
  refreshClientOptionLabels();
  render();
}

function applyTheme(){
  document.body.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
  document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '☀' : '◐';
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    setStatus('Could not save — try again.');
  }
}

function setStatus(msg){
  const el = document.getElementById('statusLine');
  el.textContent = msg;
  if(msg) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2200);
}

function refreshClientOptionLabels(){
  document.querySelector('#entryClient option[value="A"]').textContent = state.clientAName;
  document.querySelector('#entryClient option[value="B"]').textContent = state.clientBName;
}

// Counts are read directly from each entry's isExtra flag — no auto-overflow logic
function clientCounts(client){
  const c = {imageCommitted:0, imageExtra:0, videoCommitted:0, videoExtra:0, miscExtra:0};
  state.entries.filter(e=>e.client===client).forEach(e=>{
    if(e.type==='image' && !e.isExtra) c.imageCommitted++;
    if(e.type==='image' && e.isExtra) c.imageExtra++;
    if(e.type==='video' && !e.isExtra) c.videoCommitted++;
    if(e.type==='video' && e.isExtra) c.videoExtra++;
    if(e.type==='misc') c.miscExtra++; // misc is always extra by definition
  });
  return c;
}

function renderCard(client, name){
  const c = clientCounts(client);
  const imgPct = Math.min(100, (c.imageCommitted/IMG_TARGET)*100);
  const vidPct = Math.min(100, (c.videoCommitted/VID_TARGET)*100);
  const extraBits = [];
  if(c.imageExtra) extraBits.push(`${c.imageExtra} img`);
  if(c.videoExtra) extraBits.push(`${c.videoExtra} vid`);
  if(c.miscExtra) extraBits.push(`${c.miscExtra} misc`);

  return `
    <div class="card">
      <div class="card-top">
        <div class="cname">${escapeHtml(name)}</div>
      </div>
      <div class="meter-row">
        <div class="meter-label">
          <span><span class="tag" style="background:var(--image-clr)"></span>Images — ${c.imageCommitted}/${IMG_TARGET}</span>
        </div>
        <div class="meter-track"><div class="meter-fill" style="width:${imgPct}%; background:var(--image-clr)"></div></div>
      </div>
      <div class="meter-row">
        <div class="meter-label">
          <span><span class="tag" style="background:var(--video-clr)"></span>Videos — ${c.videoCommitted}/${VID_TARGET}</span>
        </div>
        <div class="meter-track"><div class="meter-fill" style="width:${vidPct}%; background:var(--video-clr)"></div></div>
      </div>
      ${extraBits.length ? `<div class="meter-row" style="margin-top:2px;"><span class="extra-pill">Extras: ${extraBits.join(', ')}</span></div>` : ''}
    </div>
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

function render(){
  document.getElementById('cardsContainer').innerHTML =
    renderCard('A', state.clientAName) + renderCard('B', state.clientBName);
  refreshClientOptionLabels();

  const sorted = state.entries.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.id - a.id);
  document.getElementById('logCount').textContent = `${state.entries.length} logged`;

  const listEl = document.getElementById('logList');
  if(sorted.length === 0){
    listEl.innerHTML = `<div class="empty">Nothing logged yet — add your first creative above.</div>`;
    return;
  }
  const typeLabel = {image:'Image', video:'Video/Reel', misc:'Misc/Other'};
  const dotColorFor = {image:'var(--image-clr)', video:'var(--video-clr)', misc:'var(--extra-clr)'};
  listEl.innerHTML = sorted.map(e => {
    const clientLabel = e.client === 'A' ? state.clientAName : state.clientBName;
    const descHtml = e.description ? `<div class="log-meta" style="margin-top:3px;">${escapeHtml(e.description)}</div>` : '';
    return `
      <div class="log-item" data-id="${e.id}">
        <div class="log-dot" style="background:${dotColorFor[e.type]}"></div>
        <div class="log-main">
          <div class="log-name">${escapeHtml(e.name)}</div>
          <div class="log-meta">${escapeHtml(clientLabel)} · ${typeLabel[e.type]} · ${formatDate(e.date)}</div>
          ${descHtml}
        </div>
        <div class="log-status ${e.isExtra ? 'extra' : 'committed'}">${e.isExtra ? 'Extra' : 'Counted'}</div>
        <button class="del-btn" data-del="${e.id}" title="Remove">✕</button>
      </div>
    `;
  }).join('');
}

function buildReportText(){
  const typeLabel = {image:'Image', video:'Video', misc:'Misc/Other'};
  const parts = ['A','B'].map(client=>{
    const name = client === 'A' ? state.clientAName : state.clientBName;
    const c = clientCounts(client);
    let lines = [];
    lines.push(`${name}`);
    lines.push(`  Images: ${c.imageCommitted}/${IMG_TARGET} delivered${c.imageExtra ? ` (+${c.imageExtra} extra)` : ''}`);
    lines.push(`  Videos/Reels: ${c.videoCommitted}/${VID_TARGET} delivered${c.videoExtra ? ` (+${c.videoExtra} extra)` : ''}`);
    if(c.miscExtra) lines.push(`  Misc/Other extras: ${c.miscExtra}`);

    const entries = state.entries.filter(e=>e.client===client).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(entries.length){
      lines.push('  Creatives:');
      entries.forEach(e=>{
        let entryLine = `    - ${formatDate(e.date)} — ${e.name} (${typeLabel[e.type]}${e.isExtra ? ', extra' : ''})`;
        lines.push(entryLine);
        if(e.description) lines.push(`        → ${e.description}`);
      });
    }
    return lines.join('\n');
  });
  return parts.join('\n\n');
}

// Events
document.getElementById('clientAName').addEventListener('change', (e)=>{
  state.clientAName = e.target.value.trim() || 'Client 1';
  saveState(); render();
});
document.getElementById('clientBName').addEventListener('change', (e)=>{
  state.clientBName = e.target.value.trim() || 'Client 2';
  saveState(); render();
});

function setActiveTypeButton(){
  document.getElementById('btnImage').classList.toggle('active', currentType === 'image');
  document.getElementById('btnVideo').classList.toggle('active', currentType === 'video');
  document.getElementById('btnMisc').classList.toggle('active', currentType === 'misc');
}
document.getElementById('btnImage').addEventListener('click', ()=>{ currentType = 'image'; setActiveTypeButton(); });
document.getElementById('btnVideo').addEventListener('click', ()=>{ currentType = 'video'; setActiveTypeButton(); });
document.getElementById('btnMisc').addEventListener('click', ()=>{ currentType = 'misc'; setActiveTypeButton(); });

document.getElementById('extraCheckbox').addEventListener('change', (e)=>{
  isExtra = e.target.checked;
  const miscBtn = document.getElementById('btnMisc');
  const descField = document.getElementById('descriptionField');
  miscBtn.classList.toggle('hidden', !isExtra);
  descField.style.display = isExtra ? 'block' : 'none';
  if(!isExtra && currentType === 'misc'){
    currentType = 'image';
    setActiveTypeButton();
  }
});

document.getElementById('addBtn').addEventListener('click', ()=>{
  const client = document.getElementById('entryClient').value;
  const name = document.getElementById('entryName').value.trim();
  const description = document.getElementById('entryDescription').value.trim();
  const date = document.getElementById('entryDate').value || todayISO();
  if(!name){
    setStatus('Enter a creative name first.');
    return;
  }
  state.entries.push({
    id: Date.now(),
    client, type: currentType, name, date,
    isExtra, description: description || undefined
  });
  document.getElementById('entryName').value = '';
  document.getElementById('entryDescription').value = '';
  saveState();
  render();
  setStatus('Added.');
});

document.getElementById('logList').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-del]');
  if(!btn) return;
  const id = Number(btn.getAttribute('data-del'));
  state.entries = state.entries.filter(en => en.id !== id);
  await saveState();
  render();
});

// Backup / restore
document.getElementById('exportBtn').addEventListener('click', ()=>{
  try{
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      storageKey: STORAGE_KEY,
      state
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `creative-tracker-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    document.getElementById('backupStatus').textContent = 'Backup exported.';
    setTimeout(()=>{ document.getElementById('backupStatus').textContent=''; }, 2200);
  }catch(e){
    document.getElementById('backupStatus').textContent = 'Could not export backup.';
  }
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    const imported = backup && backup.state ? backup.state : backup;

    if(!imported || !Array.isArray(imported.entries)){
      throw new Error('Invalid backup');
    }

    const ok = confirm('Import this backup? Your current tracker data on this device will be replaced.');
    if(!ok){
      e.target.value = '';
      return;
    }

    state = Object.assign({
      clientAName:'Client 1',
      clientBName:'Client 2',
      entries:[],
      theme:'light'
    }, imported);

    await saveState();
    document.getElementById('clientAName').value = state.clientAName;
    document.getElementById('clientBName').value = state.clientBName;
    applyTheme();
    refreshClientOptionLabels();
    render();

    document.getElementById('backupStatus').textContent = 'Backup imported successfully.';
    setTimeout(()=>{ document.getElementById('backupStatus').textContent=''; }, 2200);
  }catch(err){
    document.getElementById('backupStatus').textContent = 'Invalid backup file.';
  }finally{
    e.target.value = '';
  }
});

document.getElementById('reportBtn').addEventListener('click', ()=>{
  const box = document.getElementById('reportBox');
  box.textContent = buildReportText();
  box.classList.toggle('show');
  if(box.classList.contains('show')){
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copy report text';
    copyBtn.onclick = ()=>{
      navigator.clipboard.writeText(buildReportText()).then(()=>{
        copyBtn.textContent = 'Copied!';
        setTimeout(()=>{ copyBtn.textContent = 'Copy report text'; }, 1500);
      });
    };
    box.appendChild(document.createElement('br'));
    box.appendChild(copyBtn);
  }
});

document.getElementById('themeToggle').addEventListener('click', async ()=>{
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  await saveState();
});

loadState();
</script>
</body>
</html>
